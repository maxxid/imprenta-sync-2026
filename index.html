                      setConfigDraft(current => ({ ...current, feriados: [...(current.feriados || []), { ...newHoliday }] }));
                      setNewHoliday({ fecha: '', motivo: '', universidad: '' });
                    }} disabled={!newHoliday.fecha || !newHoliday.motivo}>Agregar feriado</button>
                  </div>
                </div>
              </div>

              <div className="card p-5">
                <div className="font-700 text-sm text-ink-800 mb-4">Universidades y ventanas de entrega</div>
                <div className="space-y-6">
                  {getCareers(configDraft, books).map(career => (
                    <div key={career.id_carrera} className="rounded-xl border border-ink-100 bg-ink-50 p-4">
                      <div className="flex items-start justify-between gap-4 mb-3">
                        <div>
                          <div className="font-800 text-sm text-ink-900">{careerLabel(career)}</div>
                          <div className="text-xs text-ink-500 mt-0.5">{career.direccion_entrega}</div>
                        </div>
                      </div>
                      <div className="flex flex-wrap gap-2">
                        {(career.ventanas || []).map((window, wIdx) => {
                          const isActive = window.activa !== false;
                          return (
                            <button
                              key={`${career.id_carrera}-${wIdx}`}
                              onClick={() => setConfigDraft(current => ({
                                ...current,
                                carreras: current.carreras.map(c => {
                                  if (c.id_carrera !== career.id_carrera) return c;
                                  const ventanas = [...(c.ventanas || [])];
                                  if (!ventanas[wIdx]) return c;
                                  ventanas[wIdx] = { ...ventanas[wIdx], activa: ventanas[wIdx].activa === false ? true : false };
                                  return { ...c, ventanas };
                                })
                              }))}
                              className={`inline-flex items-center gap-1.5 px-2.5 py-1.5 rounded-lg text-xs font-700 border transition-all ${
                                isActive
                                  ? 'bg-emerald-50 text-emerald-700 border-emerald-200 hover:bg-emerald-100'
                                  : 'bg-gray-100 text-gray-400 border-gray-200 hover:bg-gray-200'
                              }`}
                              title={isActive ? 'Clic para desactivar' : 'Clic para activar'}
                            >
                              <span className={`w-1.5 h-1.5 rounded-full ${isActive ? 'bg-emerald-500' : 'bg-gray-300'}`} />
                              {window.label} · {window.horario}
                            </button>
                          );
                        })}
                        {(career.ventanas || []).length === 0 && (
                          <span className="text-xs text-ink-400">Sin ventanas configuradas</span>
                        )}
                      </div>
                    </div>
                  ))}
                </div>
              </div>

              <div className="flex items-center justify-end gap-3 sticky bottom-4 bg-surface-hover/80 backdrop-blur-sm p-3 rounded-xl border border-ink-100 shadow-sm z-10">
                <span className="text-xs text-ink-400 mr-auto">{JSON.stringify(config) !== JSON.stringify(configDraft) ? 'Hay cambios sin guardar' : 'Sin cambios'}</span>
                <button className="btn-secondary text-sm px-4 py-2" onClick={() => setConfigDraft(JSON.parse(JSON.stringify(config)))} disabled={savingConfig}>Descartar</button>
                <button className="btn-primary text-sm px-4 py-2" disabled={savingConfig} onClick={async () => { setSavingConfig(true); await new Promise(r => setTimeout(r, 400)); const finalConfig = deepMerge(JSON.parse(JSON.stringify(config)), configDraft); let saved = false; try { saveLocal(STORAGE.config, finalConfig); saved = await saveConfigToSupabase(finalConfig, finalConfig); } catch(e) { console.error('SAVE ERROR:', e); } setConfig(finalConfig); setSavingConfig(false); }}>{savingConfig ? <span className="flex items-center gap-1"><span className="spinner-sm" /> Guardando...</span> : 'Guardar cambios'}</button>
              </div>
            </div>
          )}
          {refreshing && (
            <div className="fixed inset-0 z-[300] flex items-center justify-center" style={{ background: 'rgba(0,0,0,0.4)', backdropFilter: 'blur(6px)' }}>
              <div className="bg-surface rounded-2xl shadow-2xl p-8 text-center max-w-xs w-full mx-4 slide-up">
                <div className="w-12 h-12 mx-auto mb-4">
                  <svg className="animate-spin w-12 h-12 text-brand-DEFAULT" viewBox="0 0 24 24" fill="none">
                    <circle cx="12" cy="12" r="10" stroke="currentColor" strokeWidth="3" opacity="0.2" />
                    <path d="M12 2a10 10 0 0 1 10 10" stroke="currentColor" strokeWidth="3" strokeLinecap="round" />
                  </svg>
                </div>
                <div className="font-800 text-ink-900 text-base mb-1">Actualizando datos</div>
                <div className="text-sm text-ink-400">Sincronizando con Supabase...</div>
              </div>
            </div>
          )}
        </div>
      );
    }

    function createDemoOrders(books, config) {
      const today = new Date().toISOString().split('T')[0];
      const tomorrowDate = new Date();
      tomorrowDate.setDate(tomorrowDate.getDate() + 1);
      const tomorrow = tomorrowDate.toISOString().split('T')[0];
      const sample = [
        { book: books[0], nombre: 'Lucia Fernandez', pago: 'total', fecha: today, turno: 'tarde', express: false, estado: 'Pendiente de impresión' },
        { book: books[3], nombre: 'Martin Sosa', pago: 'sena', fecha: tomorrow, turno: 'manana', express: true, estado: 'Imprimiendo' },
        { book: books[5], nombre: 'Ana Juarez', pago: 'total', fecha: tomorrow, turno: 'tarde', express: false, estado: 'Listo' }
      ].filter(entry => entry.book);

      return sample.map((entry, index) => {
        const formato = getBookFormats(entry.book)[0];
        const career = getCareer(config, books, bookCareerId(entry.book));
        const horario = entry.turno === 'manana' ? '10:00' : '19:00';
        const pricing = calcPrecioItem(entry.book, formato, 'basica', config, false, entry.express);
        const total = pricing.total;
        const monto = entry.pago === 'sena' ? roundTotal(total * 0.5, config) : total;
        return {
          id: `P00${index + 1}`,
          nombre: entry.nombre,
          whatsapp: `11600000${index + 1}`,
          items: [{
            id: `${entry.book.id}-${index}`,
            libroId: entry.book.id,
            titulo: entry.book.titulo,
            materia: entry.book.materia,
            carrera: entry.book.carrera,
            id_carrera: bookCareerId(entry.book),
            paginas: entry.book.paginas,
            hojas: pricing.hojas,
            formato,
            encuadernacion: 'basica',
            color: false,
            express: entry.express,
            precio: total,
            tipo: pricing.tipo,
            imagen_url: entry.book.imagen_url,
            estado: entry.estado
          }],
          libro: entry.book.titulo,
          carrera: entry.book.carrera,
          id_carrera: bookCareerId(entry.book),
          materia: entry.book.materia,
          formato: `${formato} B/N${entry.express ? ' Express' : ''}`,
          paginas: entry.book.paginas,
          hojas: pricing.hojas,
          subtotal: total,
          total,
          monto_pagado: monto,
          saldo_pendiente: Math.max(0, total - monto),
          pago_modalidad: entry.pago,
          estado: entry.estado,
          fecha: entry.fecha,
          turno: entry.turno,
          modalidad_entrega: 'Retiro facultad',
          express: entry.express,
          ventana_retiro: `${entry.fecha} · ${horario}`,
          lugar_entrega: careerAddress(career, config),
          horario_entrega: horario,
          talo_ref: `DEMO-P00${index + 1}`,
          ts: new Date().toISOString()
        };
      });
    }

    function App() {
      const [screen, setScreen] = React.useState('home');
      const [bookSel, setBookSel] = React.useState(null);
      const [carrito, setCarrito] = React.useState([]);
      const [books, setBooks] = React.useState([]);
      const [config, setConfig] = React.useState(FALLBACK_CONFIG);
      const [orders, setOrders] = React.useState([]);
      const [catalogFilters, setCatalogFilters] = React.useState({ career: '', query: '', materia: '' });
      const [checkoutForm, setCheckoutForm] = React.useState({ nombre: '', whatsapp: '', pago: 'total', modalidad: 'Retiro facultad' });
      const [sidebarOpen, setSidebarOpen] = React.useState(false);
      const [loading, setLoading] = React.useState(true);
      const [adminAuthed, setAdminAuthed] = React.useState(loadLocal(STORAGE.admin, false));
      const [sessionExpired, setSessionExpired] = React.useState(false);
      const [theme, setTheme] = React.useState(loadLocal('imprenta.theme', 'light'));

      React.useEffect(() => {
        document.documentElement.classList.toggle('dark', theme === 'dark');
      }, [theme]);

      React.useEffect(() => {
        async function init() {
          const savedConfig = loadLocal(STORAGE.config, null);
          const loadedConfig = await loadJson('./config.json', FALLBACK_CONFIG);
          const supabaseConfig = await fetchConfigFromSupabase(loadedConfig);
          const baseConfig = supabaseConfig ? deepMerge(loadedConfig, supabaseConfig) : loadedConfig;
          const mergedConfig = normalizeConfig(savedConfig ? deepMerge(baseConfig, savedConfig) : baseConfig);
          const savedCarrito = loadLocal(STORAGE.carrito, []);
          const savedForm = loadLocal(STORAGE.checkoutForm, null);
          const savedCliente = loadLocal(STORAGE.cliente, null);
          setConfig(mergedConfig);

          // Restaurar sesión de admin si hay token guardado
          const savedAdmin = loadLocal(STORAGE.admin, null);
          if (savedAdmin?.token) {
            try {
              const sb = getSupabase(mergedConfig);
              const { error } = await sb.auth.setSession({ access_token: savedAdmin.token, refresh_token: savedAdmin.refresh_token || '' });
              if (error) {
                console.warn('Sesión admin expirada, requiriendo login:', error.message);
                saveLocal(STORAGE.admin, false);
                setAdminAuthed(false);
                setSessionExpired(true);
              }
            } catch (e) {
              console.warn('Error restaurando sesión admin:', e.message);
              setSessionExpired(true);
            }
          }

          // Cargar libros desde Supabase (fuente única de verdad)
          let booksData = await fetchBooksFromSupabase(mergedConfig);
          if (!booksData || booksData.length === 0) {
            booksData = await loadJson('./libros.json', []);
          }
          const migratedBooks = booksData.map(b => migrateBook(b, mergedConfig));
          setBooks(migratedBooks);

          if (savedCarrito && savedCarrito.length > 0) setCarrito(savedCarrito);
          if (savedForm) setCheckoutForm(savedForm);
          if (savedCliente && !savedForm) setCheckoutForm(current => ({ ...current, ...savedCliente }));

          // Cargar pedidos desde Supabase (fuente única de verdad)
          let ordersData = await fetchOrdersFromSupabase(mergedConfig);
          if (!ordersData || ordersData.length === 0) {
            ordersData = [];
          }
          setOrders(ordersData);
          setLoading(false);
        }
        init();
      }, []);

      React.useEffect(() => {
      }, [config, loading]);

      React.useEffect(() => {
        saveLocal('imprenta.theme', theme);
      }, [theme]);

      // Nota: pedidos y libros ahora viven en Supabase.
      // Los localStorage correspondientes se usan solo como caché offline de fallback.
      React.useEffect(() => {
        // Pedidos viven en Supabase, no se cachean localmente con PII
      }, [orders, loading]);

      React.useEffect(() => {
        if (!adminAuthed) return;
        const interval = setInterval(async () => {
          try {
            const sb = getSupabase(config);
            const { error } = await sb.auth.getSession();
            if (error) {
              console.warn('Sesión admin expirada durante uso');
              saveLocal(STORAGE.admin, false);
              setAdminAuthed(false);
              setSessionExpired(true);
            }
          } catch (e) {
            console.warn('Error verificando sesión:', e.message);
          }
        }, 5 * 60 * 1000);
        return () => clearInterval(interval);
      }, [adminAuthed, config]);

      React.useEffect(() => {
        // Libros viven en Supabase, no se cachean localmente
      }, [books, loading]);

      React.useEffect(() => {
        if (!loading) {
          saveLocal(STORAGE.checkoutForm, checkoutForm);
          saveLocal(STORAGE.cliente, { nombre: checkoutForm.nombre, whatsapp: checkoutForm.whatsapp });
        }
      }, [checkoutForm, loading]);

      const navItems = [
        { id: 'home', label: 'Catalogo', icon: <Icon.Book /> },
        { id: 'checkout', label: 'Mi pedido', icon: <Icon.Cart />, badge: carrito.length },
        { id: 'tracking', label: 'Segui tu pedido', icon: <Icon.Bell /> },
        { id: 'ayuda', label: 'Ayuda', icon: <Icon.Help /> },
        { id: 'admin', label: 'Administracion', icon: <Icon.Settings /> }
      ];
      const isAdmin = screen === 'admin';

      if (loading) {
        return <div className="page-loader"><div className="card p-6 flex items-center gap-3"><Spinner /> Cargando catalogo y configuracion...</div></div>;
      }

      return (
        <div className="min-h-screen bg-ink-50 font-sans">
          <nav className="bg-surface border-b border-ink-100 sticky top-0 z-50">
            <div className={`mx-auto px-4 h-14 flex items-center justify-between ${isAdmin ? 'max-w-[1440px]' : 'max-w-6xl'}`}>
              <button onClick={() => setScreen('home')} className="flex items-center gap-2.5">
                <div className="w-8 h-8 rounded-xl bg-ink-900 flex items-center justify-center text-white text-sm">IS</div>
                <span className="font-800 text-ink-900 dark:text-white text-base leading-none">Imprenta<br /><span className="text-brand-DEFAULT text-xs font-700">Sync 2026</span></span>
              </button>
              <div className="hidden sm:flex items-center gap-1">
                <button onClick={() => setTheme(theme === 'dark' ? 'light' : 'dark')} className="p-2 rounded-lg text-ink-400 hover:bg-ink-100 hover:text-ink-700 transition-colors" title={theme === 'dark' ? 'Modo claro' : 'Modo oscuro'}>
                  {theme === 'dark' ? (
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>
                  ) : (
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
                  )}
                </button>
                {navItems.map(item => (
                  <button key={item.id} onClick={() => setScreen(item.id)} className={`relative flex items-center gap-2 px-3 py-2 rounded-lg text-sm font-700 transition-all ${screen === item.id || (screen === 'ficha' && item.id === 'home') ? 'bg-ink-900 text-white dark:bg-ink-900 dark:text-black' : 'text-ink-500 hover:bg-ink-100'}`}>
                    {item.icon}{item.label}
                    {item.badge > 0 && <span className="absolute -top-1 -right-1 w-4 h-4 bg-accent text-white rounded-full text-xs flex items-center justify-center font-800">{item.badge}</span>}
                  </button>
                ))}
              </div>
              <div className="flex sm:hidden items-center gap-2">
                {carrito.length > 0 && (
                  <button onClick={() => setScreen('checkout')} className="relative">
                    <Icon.Cart />
                    <span className="absolute -top-1 -right-1 w-4 h-4 bg-accent text-white rounded-full text-xs flex items-center justify-center font-800">{carrito.length}</span>
                  </button>
                )}
                <button onClick={() => setSidebarOpen(true)} className="p-1"><Icon.Menu /></button>
              </div>
            </div>
          </nav>

          {sidebarOpen && (
            <div className="fixed inset-0 z-50" onClick={() => setSidebarOpen(false)}>
              <div className="absolute inset-0 bg-black/30 backdrop-blur-sm" />
              <div className="absolute right-0 top-0 bottom-0 w-64 bg-surface shadow-xl p-4" onClick={event => event.stopPropagation()}>
                <div className="flex justify-between items-center mb-5">
                  <span className="font-800 text-ink-900">Menu</span>
                  <button onClick={() => setSidebarOpen(false)}><Icon.X /></button>
                </div>
                {navItems.map(item => (
                  <button key={item.id} onClick={() => { setScreen(item.id); setSidebarOpen(false); }} className={`sidebar-link w-full ${screen === item.id ? 'active' : ''}`}>
                    {item.icon}{item.label}
                    {item.badge > 0 && <span className="ml-auto badge bg-accent text-white">{item.badge}</span>}
                  </button>
                ))}
                <div className="border-t border-ink-100 my-2" />
                <button onClick={() => setTheme(theme === 'dark' ? 'light' : 'dark')} className="sidebar-link w-full">
                  {theme === 'dark' ? (
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>
                  ) : (
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
                  )}
                  {theme === 'dark' ? 'Modo claro' : 'Modo oscuro'}
                </button>
              </div>
            </div>
          )}

          <main className={`mx-auto py-6 pb-24 ${isAdmin ? 'max-w-full px-8' : 'max-w-6xl px-4'}`}>
            {screen === 'home' && <HomeScreen books={books} config={config} carrito={carrito} catalogFilters={catalogFilters} setCatalogFilters={setCatalogFilters} onSelectLibro={book => { setBookSel(book); setScreen('ficha'); }} />}
            {screen === 'ficha' && bookSel && (
              <FichaScreen
                book={bookSel}
                config={config}
                pedidos={orders}
                carrito={carrito}
                onVolver={() => setScreen('home')}
                onAgregar={(item, isExpress) => {
                  if (isExpress) {
                    setCarrito([item]);
                    setScreen('checkout');
                  } else {
                    setCarrito(current => [...current, item]);
                    setScreen('home');
                  }
                }}
              />
            )}
            {screen === 'checkout' && <CheckoutScreen carrito={carrito} pedidos={orders} setPedidos={setOrders} config={config} onVolver={() => setScreen('home')} onSuccess={() => { setCarrito([]); setScreen('home'); }} setCarrito={setCarrito} form={checkoutForm} setForm={setCheckoutForm} />}
            {screen === 'tracking' && <OrderTracker orders={orders} books={books} config={config} onVolver={() => setScreen('home')} />}
            {screen === 'ayuda' && <AyudaScreen config={config} onVolver={() => setScreen('home')} />}
            {screen === 'admin' && (
              <>
                {sessionExpired && !adminAuthed && (
                  <div className="bg-amber-50 border border-amber-300 rounded-xl p-4 mb-4 flex items-center gap-3">
                    <span className="text-2xl">⏰</span>
                    <div className="flex-1 min-w-0">
                      <div className="font-700 text-sm text-amber-800">Tu sesión expiró</div>
                      <div className="text-xs text-amber-600">Por seguridad, las sesiones de administrador caducan. Iniciá sesión nuevamente para seguir gestionando.</div>
                    </div>
                    <button className="text-xs text-amber-500 hover:text-amber-700 font-700 flex-shrink-0" onClick={() => setSessionExpired(false)}>✕</button>
                  </div>
                )}
                {adminAuthed
                ? <AdminPanel orders={orders} setOrders={setOrders} books={books} setBooks={setBooks} config={config} setConfig={setConfig} theme={theme} setTheme={setTheme} onLogout={async () => { try { const sb = window.supabase.createClient(config.supabase.url, config.supabase.anon_key); await sb.auth.signOut(); } catch (e) { console.error('Error en signOut:', e); } saveLocal(STORAGE.admin, false); setAdminAuthed(false); }} />
                : <AdminLogin config={config} onSuccess={v => { setAdminAuthed(v); setSessionExpired(false); }} />
                }
              </>
            )}
          </main>

          <div className="sm:hidden fixed bottom-0 left-0 right-0 bg-surface border-t border-ink-100 flex z-40">
            {navItems.map(item => (
              <button key={item.id} onClick={() => setScreen(item.id)} className={`flex-1 flex flex-col items-center gap-1 py-3 text-xs font-700 transition-colors relative ${screen === item.id || (screen === 'ficha' && item.id === 'home') ? 'text-brand-DEFAULT' : 'text-ink-400'}`}>
                {item.icon}
                <span>{item.label}</span>
                {item.badge > 0 && <span className="absolute top-2 right-1/4 w-4 h-4 bg-accent text-white rounded-full text-xs flex items-center justify-center font-800">{item.badge}</span>}
              </button>
            ))}
          </div>
        </div>
      );
    }

    ReactDOM.render(<App />, document.getElementById('root'));
  </script>


</body></html>
